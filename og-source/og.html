<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #eef2ff; font-family: Arial, Helvetica, sans-serif; color: #000; display: flex; flex-direction: column; }
  .bar { background: #d6daf0; border-bottom: 2px solid #b7c5d9; padding: 18px 48px; font-size: 26px; color: #34345c; }
  .bar b { color: #af0a0f; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 64px; }
  h1 { margin: 0; font-size: 112px; line-height: 1; color: #af0a0f; letter-spacing: -2px; }
  .sub { margin-top: 22px; font-size: 34px; color: #34345c; }
  .boards { margin-top: 44px; display: flex; gap: 18px; }
  .boards span { background: #d6daf0; border: 2px solid #b7c5d9; padding: 12px 22px; font-size: 34px; font-weight: 700; color: #af0a0f; }
  .foot { padding: 20px 48px; font-size: 28px; color: #34345c; border-top: 2px solid #b7c5d9; display: flex; justify-content: space-between; }
  .score { color: #af0a0f; font-weight: 700; }
</style></head>
<body>
  <div class="bar">[ <b>tech</b> / <b>geo</b> / <b>ind</b> / <b>cinema</b> ]</div>
  <div class="main">
    <h1>Daily Nachrichts</h1>
    <div class="sub">Tech, geopolitics, India and cinema. Every story scored 0 to 100 by how loudly it is being discussed.</div>
    <div class="boards"><span>/tech/</span><span>/geo/</span><span>/ind/</span><span>/cinema/</span></div>
  </div>
  <div class="foot"><span>news.walrus.codes</span><span><span class="score">[85+ Critical]</span> &middot; updated twice a day</span></div>
</body></html>
