<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Nachrichts</title>
<meta name="description" content="Tech, geopolitics and India, one board each, every story scored by how loudly it is being discussed.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="boardlist">[<a href="/tech/">tech</a> / <a href="/geo/">geo</a> / <a href="/ind/">ind</a> / <a href="/wort/">wort</a>]</div>
<div class="banner">
  <h1>Daily Nachrichts</h1>
  <div class="sub" id="edition">loading</div>
</div>

<div class="frontbox popular">
  <div class="boxhead">Zurzeit Threads</div>
  <div class="boxbody" id="popular"><span class="small">Loading...</span></div>
</div>

<div class="frontbox notesbox">
  <div class="boxhead">Today</div>
  <div class="boxbody"><div id="headline" style="font-weight:700;margin-bottom:4px"></div><div id="standfirst" style="margin-bottom:8px"></div><ul id="notes" style="margin:0;padding-left:16px"></ul></div>
</div>

<div class="frontbox">
  <div class="boxhead">Editions</div>
  <div class="boxbody"><ul class="editions" id="editions" style="margin:0;padding-left:16px"></ul></div>
</div>

<div class="footer">
  Score = how loudly a story is being talked about (0 to 100): 85+ Critical, 70-84 High, 40-69 Moderate, under 40 Low. Not an importance score.<br>
  <span id="stamp"></span>
</div>
<div class="boardlist bottom">[<a href="/tech/">tech</a> / <a href="/geo/">geo</a> / <a href="/ind/">ind</a> / <a href="/wort/">wort</a>]</div>

<script src="/day.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const band = s => s >= 85 ? 'Critical' : s >= 70 ? 'High' : s >= 40 ? 'Moderate' : 'Low';
  async function init() {
    try {
      // One entry per date: all Phoenix runs of that day merged (see /day.js). ?d=YYYY-MM-DD picks a past day.
      const { days, day, isLatest, data: d } = await Nachrichts.loadDay(new URLSearchParams(location.search));
      const q = day && !isLatest ? `?d=${encodeURIComponent(day.date)}` : '';
      document.querySelectorAll('a[href="/tech/"], a[href="/geo/"], a[href="/ind/"]').forEach(a => a.setAttribute('href', a.getAttribute('href') + q));
      $('#editions').innerHTML = days.map((e, i) => {
        const here = day && day.date === e.date;
        const label = here ? `<b>${esc(e.label)}</b>` : esc(e.label);
        const runs = e.files.length > 1 ? ` <span class="small">(${e.files.length} runs)</span>` : '';
        return `<li><a href="${i === 0 ? '/' : `/?d=${encodeURIComponent(e.date)}`}">${label}</a>${runs}${i === 0 ? ' <span class="small">(latest)</span>' : ''}${here ? ' <span class="small">(viewing)</span>' : ''}</li>`;
      }).join('') || '<li class="small">none yet</li>';
      $('#edition').innerHTML = `${esc(d.edition)} &middot; <a href="/tech/${q}">read the boards</a>${!isLatest ? ' &middot; <a href="/">back to latest</a>' : ''}`;
      $('#headline').textContent = d.headline || '';
      $('#standfirst').textContent = d.standfirst || '';
      $('#notes').innerHTML = (d.notes || []).map(n => `<li>${esc(n)}</li>`).join('');
      $('#stamp').textContent = `Generated ${d.generated} by ${d.model}`;
      // Zurzeit: one group per board (tech, geo, ind), each with its five loudest threads.
      // Owner request 2026-10-23: "only 3 /category/ things on in that zurzeit thing".
      $('#popular').innerHTML = d.sections.map(sec => {
        const tag = Nachrichts.slug(sec.id);
        const top = [...sec.stories].sort((a, b) => b.score - a.score).slice(0, 5);
        return `<div class="group"><a class="b" href="/${esc(tag)}/${q}">/${esc(tag)}/</a> <span class="small">${esc(sec.title)} &middot; ${sec.stories.length} threads</span>` +
          top.map(s => `<div class="thread"><span class="s">[${s.score} ${band(s.score)}]</span> <a class="t" href="/${esc(tag)}/${q}#${esc(s.id)}">${esc(s.title)}</a></div>`).join('') + '</div>';
      }).join('');
    } catch (e) {
      $('#popular').innerHTML = `<span class="small">Could not load the edition (${esc(e.message)}).</span>`;
    }
  }
  init();
})();
</script>
</body>
</html>
